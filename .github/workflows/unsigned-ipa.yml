name: AquaSign unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build AquaSign unsigned iOS IPA
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Apple signing bridge
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/SigningBridgeTarget" cargo build --manifest-path SigningBridge/Cargo.toml --release --target aarch64-apple-ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project SidePair.xcodeproj -scheme SidePair

      - name: Build for iPhone without signing
        run: |
          BRIDGE_LIB="$RUNNER_TEMP/SigningBridgeTarget/aarch64-apple-ios/release"
          xcodebuild \
            -project SidePair.xcodeproj \
            -scheme SidePair \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) SIGNING_BRIDGE' \
            OTHER_LDFLAGS="\$(inherited) -L$BRIDGE_LIB -lsidepair_signing_bridge -lc++ -framework Security -framework CoreFoundation -framework SystemConfiguration -framework CFNetwork"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/SidePair.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/AquaSign.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/AquaSign-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/AquaSign-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AquaSign-unsigned-ipa
          path: ${{ runner.temp }}/AquaSign-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  build-aqua-installer:
    name: Build Aqua Installer for macOS
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Apple signing bridge for Apple silicon
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/AquaInstallerRust
        run: cargo build --manifest-path SigningBridge/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build Apple signing bridge for Intel
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/AquaInstallerRust
        run: cargo build --manifest-path SigningBridge/Cargo.toml --release --target x86_64-apple-darwin

      - name: Build universal Aqua Installer app
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/AquaInstallerRust
          AQUA_INSTALLER_OUTPUT_DIR: ${{ runner.temp }}/AquaInstallerBuild
        run: bash AquaInstaller/build-macos.sh

      - name: Package Aqua Installer
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/AquaInstallerBuild/Aqua Installer.app" "$RUNNER_TEMP/Aqua-Installer-macOS-universal.zip"

      - name: Upload Aqua Installer
        uses: actions/upload-artifact@v4
        with:
          name: Aqua-Installer-macOS-universal
          path: ${{ runner.temp }}/Aqua-Installer-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
