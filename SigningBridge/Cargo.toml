[package]
name = "sidepair-signing-bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "sidepair_signing_bridge"
crate-type = ["staticlib"]

[dependencies]
isideload = { version = "=0.5.0", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
hex = "0.4.3"
p12-keystore = { package = "isideload-p12-keystore", version = "=0.3.0-rc4" }
rootcause = "0.12"
rsa = "0.9.10"
sha2 = "0.11.0"
x509-cert = "0.2.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
zeroize = "1"
