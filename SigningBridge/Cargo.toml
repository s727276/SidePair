[package]
name = "sidepair-signing-bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "sidepair_signing_bridge"
crate-type = ["staticlib"]

[dependencies]
isideload = { version = "=0.5.0", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
rootcause = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
zeroize = "1"
